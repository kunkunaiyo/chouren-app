name: Build Flet APK (arm64)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true                     # 保险起见，图片走 Git LFS 时也不会缺

      - uses: subosito/flutter-action@v2 # 关键：装 Flutter SDK（含 Android 工具链）
        with:
          channel: stable
          java-version: '17'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install flet

      - name: Build arm64 APK
        working-directory: .           # 项目根目录，和 assets/ 同级
        run: |
          flet build apk \
            --flutter-build-args=--target-platform \
            --flutter-build-args=android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chouren-apk-arm64
          path: build/apk/*.apk
